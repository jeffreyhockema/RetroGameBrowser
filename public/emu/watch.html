<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Watching a game</title>
  <link rel="stylesheet" href="/player/shell.css">
  <style>
    /* A friend's side of a game played by video (see /player/stream-viewer.js): the host's
       game as a video, the whole stage, and on a phone a few buttons over it. */
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    .watch-stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
    .watch-stage video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .watch-note { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); max-width: min(90vw, 520px); padding: 8px 14px; background: rgb(17 31 48 / 0.9); color: #e7eef6; border: 1px solid #2f4760; border-radius: 8px; font: 400 0.9rem/1.4 "Inter", system-ui, sans-serif; text-align: center; }
    .watch-tap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgb(0 0 0 / 0.6); color: #e7eef6; border: 0; font: 600 1.1rem "Inter", system-ui, sans-serif; cursor: pointer; }
    /* The on-screen pad, built for the room's console by /player/stream-viewer.js: a cross (or
       a stick) on the left, face buttons on the right, shoulder buttons above them, and the
       small ones in the middle. Everything is placed from the bottom of the screen. */
    .watch-pad { position: fixed; inset: auto 0 0 0; height: 44%; pointer-events: none; touch-action: none; user-select: none; -webkit-user-select: none; }
    .watch-pad button { position: absolute; width: 56px; height: 56px; padding: 0; border: 1px solid rgb(255 255 255 / 0.35); border-radius: 50%; background: rgb(255 255 255 / 0.12); color: rgb(255 255 255 / 0.8); font: 600 0.85rem "Inter", system-ui, sans-serif; pointer-events: auto; touch-action: none; }
    .watch-pad button.is-down { background: rgb(34 211 238 / 0.55); }
    .watch-up { left: 76px; bottom: 150px; } .watch-down { left: 76px; bottom: 30px; }
    .watch-left { left: 16px; bottom: 90px; } .watch-right { left: 136px; bottom: 90px; }
    .watch-face-bottom { right: 76px; bottom: 30px; } .watch-face-right { right: 16px; bottom: 90px; }
    .watch-face-left { right: 136px; bottom: 90px; } .watch-face-top { right: 76px; bottom: 150px; }
    .watch-row-1 { right: 136px; bottom: 40px; } .watch-row-2 { right: 76px; bottom: 40px; } .watch-row-3 { right: 16px; bottom: 40px; }
    .watch-row-4 { right: 136px; bottom: 110px; } .watch-row-5 { right: 76px; bottom: 110px; } .watch-row-6 { right: 16px; bottom: 110px; }
    .watch-pad .watch-select, .watch-pad .watch-start, .watch-pad .watch-start-only { width: 64px; height: 30px; border-radius: 15px; bottom: 16px; font-size: 0.7rem; }
    .watch-select { left: calc(50% - 72px); } .watch-start { left: calc(50% + 8px); } .watch-start-only { left: calc(50% - 32px); }
    .watch-pad .watch-l1, .watch-pad .watch-l2, .watch-pad .watch-r1, .watch-pad .watch-r2 { width: 72px; height: 34px; border-radius: 17px; bottom: 220px; }
    .watch-l1 { left: 16px; } .watch-l2 { left: 96px; } .watch-r1 { right: 16px; } .watch-r2 { right: 96px; }
    /* The Nintendo 64: A and B, with the four C buttons above and to the right of them. */
    .watch-n64-a { right: 96px; bottom: 24px; } .watch-n64-b { right: 156px; bottom: 84px; }
    .watch-pad .watch-c-up, .watch-pad .watch-c-down, .watch-pad .watch-c-left, .watch-pad .watch-c-right { width: 44px; height: 44px; font-size: 0.7rem; }
    .watch-c-up { right: 50px; bottom: 170px; } .watch-c-down { right: 50px; bottom: 82px; }
    .watch-c-left { right: 94px; bottom: 126px; } .watch-c-right { right: 6px; bottom: 126px; }
    .watch-stick { position: absolute; left: 16px; bottom: 24px; width: 150px; height: 150px; border: 1px solid rgb(255 255 255 / 0.35); border-radius: 50%; background: rgb(255 255 255 / 0.06); pointer-events: auto; touch-action: none; }
    .watch-stick-knob { position: absolute; left: 45px; top: 45px; width: 60px; height: 60px; border-radius: 50%; background: rgb(255 255 255 / 0.25); pointer-events: none; }
  </style>
</head>
<body>
  <div class="watch-stage">
    <video id="video" autoplay playsinline></video>
  </div>
  <div class="watch-note" id="note" hidden><span id="note-text"></span></div>
  <button type="button" class="watch-tap" id="tap" hidden>Tap to start the sound</button>
  <div class="watch-pad" id="pad" hidden aria-label="Controller"></div>
  <script src="/emu/data/src/socket.io.min.js"></script>
  <script src="/player/stream-viewer.js"></script>
</body>
</html>
